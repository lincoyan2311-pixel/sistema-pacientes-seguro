name: Pruebas y SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ejecutar pruebas y cobertura
        run: python -m pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Ejecutar Bandit
        run: python -m bandit -r . -x "venv,.venv,tests" -f json -o reporte-bandit.json --exit-zero

      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}